# 主模板：以 original-template.yaml 为底稿；节点占位符由原有注入工具替换。
# 去广告 → 明确直连 → 原有 Apple 与 AI → 国内综合名单 → 海外集合 → 最终兜底。
# Apple/AI 例外在国内综合名单之前匹配，不使用 AND/NOT 排除表达式。
# DNS 的 AI 例外先匹配；其余国内类别走国内 DNS；普通代理使用 nameserver。
# AdvertisingLite/China/海外规则及 Geo 数据每天尝试更新。
# 广告支持域名和 IP 规则；IP 广告不主动触发解析，避免抢先解析所有域名。
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
ipv6: false
unified-delay: true
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: true
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - +.market.xiaomi.com
    - guzzoni.apple.com
    - mask-api.icloud.com
    - gspe1-ssl.ls.apple.com
    - +.smoot.apple.com
    - +.apple-relay.apple.com
    - +.apple-relay.cloudflare.com
    - +.apple-relay.fastly-edge.com
    - +.cp4.cloudflare.com
    - +.apple-dns.net
    - +.gateway.icloud.com
    - +.mask.icloud.com
    - +.mask-h2.icloud.com
    - +.ls.apple.com
    - +.apps.mzstatic.com
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver: &dns_1
    - https://doh.pub/dns-query#DIRECT
    - https://dns.alidns.com/dns-query#DIRECT
  nameserver:
    - https://1.1.1.1/dns-query#节点选择
    - https://8.8.8.8/dns-query#节点选择
  direct-nameserver: *dns_1
  direct-nameserver-follow-policy: false
  nameserver-policy:
    rule-set:ai_domains: &dns_2
      - https://1.1.1.1/dns-query#AI
      - https://8.8.8.8/dns-query#AI
    geosite:category-ai-!cn: *dns_2
    rule-set:direct_extra: *dns_1
    geosite:cn,private,tencent,bilibili,category-games@cn: *dns_1
    rule-set:china: *dns_1
proxies: []
proxy-groups:
  - name: 直连
    type: select
    proxies:
      - DIRECT
      - REJECT
  - name: 节点选择
    type: select
    include-all: true
    include-all-proxies: true
    include-all-providers: true
    proxies:
      - __PROXY_PROVIDERS__
      - __PROXY_NODES__
  - name: AI
    type: select
    include-all: true
    include-all-proxies: true
    include-all-providers: true
    filter: (?i)(at&t|\batt\b|verizon|vzw|\bt-?mobile|\btmo\b)
    proxies:
      - 节点选择
      - __PROXY_PROVIDERS__
      - __PROXY_NODES__
  - name: 兜底
    type: select
    proxies:
      - 节点选择
      - 直连
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
rules:
  # 1. 去广告
  - RULE-SET,advertising_lite,REJECT,no-resolve
  # 2. 明确直连：局域网、指定服务
  - DOMAIN,localhost,直连
  - DOMAIN-SUFFIX,lan,直连
  - DOMAIN-SUFFIX,local,直连
  - GEOSITE,private,直连
  - GEOIP,private,直连,no-resolve
  - PROCESS-NAME,WeChat.exe,直连
  - PROCESS-NAME,Weixin.exe,直连
  - PROCESS-NAME,WeChatAppEx.exe,直连
  - PROCESS-NAME,WeChat,直连
  - PROCESS-NAME,com.tencent.mm,直连
  - GEOSITE,tencent,直连
  - DOMAIN-KEYWORD,torrent,直连
  - DOMAIN-SUFFIX,m-team.cc,直连
  - GEOSITE,bilibili,直连
  - GEOSITE,category-games@cn,直连
  # 3. 原有 Apple 与 AI 例外
  - DOMAIN,guzzoni.apple.com,AI
  - DOMAIN,mask-api.icloud.com,AI
  - DOMAIN,gspe1-ssl.ls.apple.com,AI
  - DOMAIN-SUFFIX,smoot.apple.com,AI
  - DOMAIN-SUFFIX,apple-relay.apple.com,AI
  - DOMAIN-SUFFIX,apple-relay.cloudflare.com,AI
  - DOMAIN-SUFFIX,apple-relay.fastly-edge.com,AI
  - DOMAIN-SUFFIX,cp4.cloudflare.com,AI
  - DOMAIN-SUFFIX,apple-dns.net,AI
  - DOMAIN-SUFFIX,gateway.icloud.com,AI
  - DOMAIN-SUFFIX,mask.icloud.com,AI
  - DOMAIN-SUFFIX,mask-h2.icloud.com,AI
  - DOMAIN-SUFFIX,ls.apple.com,AI
  - DOMAIN-SUFFIX,apps.mzstatic.com,AI
  - DOMAIN-SUFFIX,anthropic.com,AI
  - DOMAIN-SUFFIX,claude.ai,AI
  - DOMAIN-SUFFIX,claude.com,AI
  - DOMAIN-SUFFIX,x.ai,AI
  - DOMAIN-SUFFIX,grok.com,AI
  - DOMAIN-SUFFIX,perplexity.ai,AI
  - DOMAIN-SUFFIX,cursor.com,AI
  - DOMAIN-SUFFIX,cursor.sh,AI
  - DOMAIN-SUFFIX,antigravity.google,AI
  - DOMAIN-SUFFIX,openai.com,AI
  - DOMAIN-SUFFIX,chatgpt.com,AI
  - DOMAIN-SUFFIX,sora.com,AI
  - GEOSITE,category-ai-!cn,AI
  # 4. 国内综合名单
  - GEOSITE,cn,直连
  - RULE-SET,china,直连
  # 5. 参考 Johnshall lazy.conf 的海外集合
  - DOMAIN-SUFFIX,litix.io,节点选择
  - DOMAIN-SUFFIX,discomax.com,节点选择
  - DOMAIN-SUFFIX,brightline.tv,节点选择
  - RULE-SET,overseas_youtube,节点选择
  - RULE-SET,overseas_netflix,节点选择
  - RULE-SET,overseas_disney,节点选择
  - RULE-SET,overseas_hbo,节点选择
  - RULE-SET,overseas_spotify,节点选择
  - RULE-SET,overseas_telegram,节点选择
  - RULE-SET,overseas_paypal,节点选择
  - RULE-SET,overseas_twitter,节点选择
  - RULE-SET,overseas_facebook,节点选择
  - RULE-SET,overseas_amazon,节点选择
  - RULE-SET,overseas_sony,节点选择
  - RULE-SET,overseas_nintendo,节点选择
  - RULE-SET,overseas_epic,节点选择
  - RULE-SET,overseas_steamcn,节点选择
  - RULE-SET,overseas_steam,节点选择
  - RULE-SET,overseas_game,节点选择
  - RULE-SET,overseas_github,节点选择
  - RULE-SET,overseas_microsoft,节点选择
  - RULE-SET,overseas_google,节点选择
  - RULE-SET,overseas_tiktok,节点选择
  - RULE-SET,overseas_global,节点选择
  - GEOSITE,google,节点选择
  - GEOSITE,microsoft,节点选择
  - GEOSITE,github,节点选择
  - GEOSITE,amazon,节点选择
  - GEOSITE,paypal,节点选择
  - GEOSITE,spotify,节点选择
  - GEOSITE,category-games,节点选择
  - GEOSITE,geolocation-!cn,节点选择
  # 6. 兜底
  - MATCH,兜底
rule-providers:
  ai_domains:
    type: inline
    behavior: domain
    payload:
      - guzzoni.apple.com
      - mask-api.icloud.com
      - gspe1-ssl.ls.apple.com
      - +.smoot.apple.com
      - +.apple-relay.apple.com
      - +.apple-relay.cloudflare.com
      - +.apple-relay.fastly-edge.com
      - +.cp4.cloudflare.com
      - +.apple-dns.net
      - +.gateway.icloud.com
      - +.mask.icloud.com
      - +.mask-h2.icloud.com
      - +.ls.apple.com
      - +.apps.mzstatic.com
      - +.anthropic.com
      - +.claude.ai
      - +.claude.com
      - +.x.ai
      - +.grok.com
      - +.perplexity.ai
      - +.cursor.com
      - +.cursor.sh
      - +.antigravity.google
      - +.openai.com
      - +.chatgpt.com
      - +.sora.com
  direct_extra:
    type: inline
    behavior: classical
    payload:
      - DOMAIN,localhost
      - DOMAIN-SUFFIX,lan
      - DOMAIN-SUFFIX,local
      - DOMAIN-KEYWORD,torrent
      - DOMAIN-SUFFIX,m-team.cc
  china:
