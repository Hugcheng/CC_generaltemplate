# ============================================================
# Mihomo / Clash 完整配置模板
#
# 策略组：
#   直连      → DIRECT
#   节点选择  → 全部订阅节点
#   AI        → 筛选节点 / 节点选择
#   兜底      → 节点选择 / 直连
#
# Apple：
#   Apple Intelligence、Siri 指定域名 → AI
#   其他 Apple 服务 → 通用分流规则
#
# 使用前：
#   替换 proxy-providers 中的订阅地址
# ============================================================


# ------------------------------------------------------------
# 基础设置
# ------------------------------------------------------------

port: 7890
socks-port: 7891

# 仅本机使用；需要局域网共享代理时改为 true
allow-lan: false

mode: rule
log-level: info
ipv6: false
unified-delay: true

external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true


# ------------------------------------------------------------
# 域名嗅探
# ------------------------------------------------------------

sniffer:
  enable: true

  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true

    TLS:
      ports:
        - 443
        - 8443

    QUIC:
      ports:
        - 443
        - 8443

  skip-domain:
    - Mijia Cloud


# ------------------------------------------------------------
# TUN
# iOS 客户端由 Apple Network Extension 管理流量接管，
# 部分 TUN 字段可能由客户端接管。
# ------------------------------------------------------------

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true

  dns-hijack:
    - any:53
    - tcp://any:53


# ------------------------------------------------------------
# DNS
# ------------------------------------------------------------

dns:
  enable: true
  ipv6: false
  respect-rules: true

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # 返回真实 IP 的域名
  # 此列表不决定直连或代理出口
  fake-ip-filter:
    - +.lan
    - +.local
    - +.market.xiaomi.com

    # Siri 与 Apple 服务
    - +.smoot.apple.com
    - guzzoni.apple.com
    - gspe1-ssl.ls.apple.com
    - +.apple-dns.net

    # Apple Intelligence 扩展与私有云计算
    - +.apple-relay.apple.com
    - +.apple-relay.cloudflare.com
    - +.apple-relay.fastly-edge.com
    - +.cp4.cloudflare.com

    # iCloud 相关
    - +.gateway.icloud.com
    - +.mask.icloud.com
    - +.mask-h2.icloud.com

  # 解析 DNS 服务器自身域名
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 代理节点域名独立直连解析
  proxy-server-nameserver:
    - "https://doh.pub/dns-query#DIRECT"
    - "https://dns.alidns.com/dns-query#DIRECT"

  # 未命中 nameserver-policy 的域名
  nameserver:
    - "https://1.1.1.1/dns-query#节点选择"
    - "https://8.8.8.8/dns-query#节点选择"

  # 直连出口域名解析
  direct-nameserver:
    - "https://doh.pub/dns-query#DIRECT"
    - "https://dns.alidns.com/dns-query#DIRECT"

  direct-nameserver-follow-policy: false

  nameserver-policy:

    # Apple Intelligence 扩展
    "apple-relay.apple.com":
      - "https://1.1.1.1/dns-query#AI"
      - "https://8.8.8.8/dns-query#AI"

    # Apple Private Cloud Compute
    "apple-relay.cloudflare.com":
      - "https://1.1.1.1/dns-query#AI"
      - "https://8.8.8.8/dns-query#AI"

    "apple-relay.fastly-edge.com":
      - "https://1.1.1.1/dns-query#AI"
      - "https://8.8.8.8/dns-query#AI"

    "cp4.cloudflare.com":
      - "https://1.1.1.1/dns-query#AI"
      - "https://8.8.8.8/dns-query#AI"

    # Siri 与听写
    "guzzoni.apple.com":
      - "https://1.1.1.1/dns-query#AI"
      - "https://8.8.8.8/dns-query#AI"

    # Siri、Spotlight、Safari 等搜索
    "+.smoot.apple.com":
      - "https://1.1.1.1/dns-query#AI"
      - "https://8.8.8.8/dns-query#AI"

    # 其他 AI 服务
    "geosite:category-ai-!cn":
      - "https://1.1.1.1/dns-query#AI"
      - "https://8.8.8.8/dns-query#AI"

    # 国内与私有域名分类
    # 内网自定义域名需要另配实际内网 DNS
    "geosite:cn,private":
      - "https://doh.pub/dns-query#DIRECT"
      - "https://dns.alidns.com/dns-query#DIRECT"

    # 已知国外域名
    "geosite:geolocation-!cn":
      - "https://1.1.1.1/dns-query#节点选择"
      - "https://8.8.8.8/dns-query#节点选择"


# ------------------------------------------------------------
# 节点订阅
#
# 替换下面的 url。
# 必须是 Clash/Mihomo 格式的节点订阅，
# 不是订阅管理网页，也不是普通 Base64 节点列表。
# ------------------------------------------------------------

proxies: []

proxy-providers:
  机场订阅:
    type: http
    url: "替换为你的Clash或Mihomo订阅地址"
    path: ./proxy_providers/airport.yaml
    interval: 86400

    # 首次下载使用直连，不依赖尚未加载的订阅节点
    proxy: DIRECT

    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300


# ------------------------------------------------------------
# 策略组：仅四组
# ------------------------------------------------------------

proxy-groups:

  # 直连
  - name: 直连
    type: select
    proxies:
      - DIRECT

  # 所有订阅节点
  - name: 节点选择
    type: select
    include-all: true
    exclude-type: Direct|Reject

  # AI：保留运营商名称筛选
  # 可手动选择匹配节点，也可跟随节点选择
  - name: AI
    type: select

    proxies:
      - 节点选择

    include-all: true
    exclude-type: Direct|Reject

    filter: '(?i)(?:^|[^A-Za-z0-9])(?:AT\s*&\s*T|ATT|AT[\s_-]T|Verizon|VZW|T[-_\s]?Mobile|TMO)\d*(?:$|[^A-Za-z0-9])'

  # 未命中规则的流量
  # 此组是分流兜底，不是节点故障自动切换
  - name: 兜底
    type: select
    proxies:
      - 节点选择
      - 直连


# ------------------------------------------------------------
# 路由规则
# 从上到下匹配，先命中先执行
# ------------------------------------------------------------

rules:

  # ==========================================================
  # 1. 本机与局域网
  # ==========================================================

  - DOMAIN,localhost,直连
  - DOMAIN-SUFFIX,lan,直连
  - DOMAIN-SUFFIX,local,直连

  - GEOSITE,private,直连
  - GEOIP,private,直连,no-resolve

  # ==========================================================
  # 2. Apple Intelligence
  # ==========================================================

  # Apple Intelligence 扩展
  - DOMAIN,apple-relay.apple.com,AI

  # Private Cloud Compute
  - DOMAIN,apple-relay.cloudflare.com,AI
  - DOMAIN,apple-relay.fastly-edge.com,AI
  - DOMAIN,cp4.cloudflare.com,AI

  # ==========================================================
  # 3. Siri、听写与搜索
  # ==========================================================

  - DOMAIN,guzzoni.apple.com,AI
  - DOMAIN-SUFFIX,smoot.apple.com,AI

  # ==========================================================
  # 4. 其他 AI 服务
  # 必须放在 Google、Microsoft 等通用规则之前
  # ==========================================================

  - GEOSITE,category-ai-!cn,AI

  # ==========================================================
  # 5. 指定直连服务
  # ==========================================================

  - GEOSITE,bilibili,直连

  # ==========================================================
  # 6. 指定代理服务
  # ==========================================================

  - GEOSITE,google,节点选择
  - GEOSITE,microsoft,节点选择
  - GEOSITE,github,节点选择
  - GEOSITE,amazon,节点选择
  - GEOSITE,paypal,节点选择
  - GEOSITE,spotify,节点选择
  - GEOSITE,category-games,节点选择

  # ==========================================================
  # 7. 通用分流
  #
  # 不设置 GEOSITE,apple,直连。
  # 未被前面规则命中的 Apple 服务，也按这里分流。
  # ==========================================================

  # 国内域名
  - GEOSITE,cn,直连

  # 已知国外域名，包括常见流媒体和社交服务
  - GEOSITE,geolocation-!cn,节点选择

  # 中国 IP：不为匹配此规则额外触发 DNS 解析
  - GEOIP,cn,直连,no-resolve

  # ==========================================================
  # 8. 最终兜底
  # ==========================================================

  - MATCH,兜底
